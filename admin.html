<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitation Management Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: auto; }
        h1, h2 { color: #2c3e50; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        @media(max-width: 768px){ .grid { grid-template-columns: 1fr; } }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        label { display: block; margin-top: 12px; font-weight: 500; font-size: 14px; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background: #d4af37; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: 500; margin-top: 15px; }
        button:hover { background: #b8962e; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-box { background: #ebf3f9; padding: 15px; border-radius: 8px; text-align: center; }
        .stat-box h3 { margin: 0; font-size: 24px; color: #2980b9; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; font-size: 14px; }
        th { background: #2c3e50; color: white; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .opened { background: #d4edda; color: #155724; }
        .pending { background: #fff3cd; color: #856404; }
        .attending { background: #cce5ff; color: #004085; }
    </style>
</head>
<body>

<div class="container">
    <h1>Wedding Invitation Center Suite</h1>
    
    <div class="grid">
        <div class="card">
            <h2>Add &amp; Create Invitation Link</h2>
            <form id="linkForm">
                <label>Guest Name</label>
                <input type="text" id="gName" placeholder="Ex: Mr. Kamal" required>

                <label>Guest Type</label>
                <select id="gType">
                    <option value="single">Single</option>
                    <option value="couple">Couple</option>
                    <option value="family">Family</option>
                </select>

                <label>Target Event</label>
                <select id="gEvent">
                    <option value="wedding">Wedding Only</option>
                    <option value="homecoming">Homecoming Only</option>
                    <option value="both">Both Events</option>
                </select>

                <label>Invitation Side (Who is sending?)</label>
                <select id="gSide">
                    <option value="bride">Bride's Side (Chathurni)</option>
                    <option value="groom">Groom's Side (Ashen)</option>
                </select>

                <button type="submit">Generate Invitation Link</button>
            </form>

            <div id="resultBox" style="margin-top: 20px; display:none;">
                <label>Generated Custom Link:</label>
                <input type="text" id="generatedLink" readonly>
                <button id="copyBtn" style="background:#2ecc71;">Copy Link</button>
            </div>
        </div>

        <div class="card">
            <h2>Realtime Analytics Dashboard</h2>
            <div class="stats-grid">
                <div class="stat-box"><h3 id="statTotal">0</h3><small>Total Guests</small></div>
                <div class="stat-box"><h3 id="statOpened">0</h3><small>Opened</small></div>
                <div class="stat-box"><h3 id="statAttending">0</h3><small>Attending</small></div>
            </div>
            <button id="exportBtn" style="background: #27ae60; width: 100%;">📊 Export Guest List to Excel</button>
        </div>
    </div>

    <div class="card" style="overflow-x: auto;">
        <h2>Active Guest Registry Database</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Event</th>
                    <th>Side</th>
                    <th>Tracking</th>
                    <th>RSVP Status</th>
                </tr>
            </thead>
            <tbody id="guestTableBody">
            </tbody>
        </table>
    </div>
</div>

<script src="admin.js"></script>
</body>
</html>
