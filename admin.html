<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation Admin Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f2f5; padding: 20px; color: #333; }
        .admin-container { max-width: 600px; margin: 20px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 2px solid #d4af37; }
        h2 { color: #d4af37; text-align: center; margin-bottom: 20px; font-size: 24px; text-transform: uppercase; letter-spacing: 1px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: #444; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; outline: none; transition: 0.3s; }
        input:focus, select:focus { border-color: #d4af37; box-shadow: 0 0 6px rgba(212, 175, 55, 0.3); }
        .btn { width: 100%; padding: 12px; background: #25D366; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .btn:hover { background: #1eb857; }
        .generate-btn { background: linear-gradient(135deg, #d4af37, #aa820a); }
        .generate-btn:hover { background: linear-gradient(135deg, #c29f2f, #967207); }
        .output-box { margin-top: 20px; padding: 15px; background: #e9f7ef; border-radius: 8px; border: 1px solid #c3e6cb; }
        .output-box h4 { margin-bottom: 10px; color: #155724; }
        textarea { width: 100%; height: 200px; padding: 10px; border-radius: 6px; border: 1px solid #a1d9b4; font-size: 13px; resize: none; font-family: inherit; }
        .copy-btn { margin-top: 10px; background: #3498db; }
        .copy-btn:hover { background: #2980b9; }
    </style>
</head>
<body>

<div class="admin-container">
    <h2>Invitation Link Generator</h2>

    <!-- 1. Sender Type -->
    <div class="form-group">
        <label for="senderType">1. Sender (කවුරුන්ද යවන්නේ?):</label>
        <select id="senderType">
            <option value="groom">Groom (Ashen Anuradha)</option>
            <option value="bride">Bride (Sanchala Jayarathne)</option>
        </select>
    </div>

    <!-- 2. Salutation Dropdown (Family Removed) -->
    <div class="form-group">
        <label for="salutationInput">2. Salutation (ආමන්ත්‍රණය):</label>
        <select id="salutationInput">
            <option value="Mr.">Mr.</option>
            <option value="Ms.">Ms.</option>
            <option value="Mrs.">Mrs.</option>
            <option value="Mr & Mrs.">Mr & Mrs.</option>
        </select>
    </div>

    <!-- 2.1 Include Family Checkbox -->
    <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
        <input type="checkbox" id="includeFamily" style="width: auto; height: 18px; cursor: pointer;">
        <label for="includeFamily" style="margin: 0; cursor: pointer; font-weight: normal;">Include Family (& Family එකතු කරන්න)</label>
    </div>

    <!-- 3. Guest Name -->
    <div class="form-group">
        <label for="guestInput">3. Guest Name (අමුත්තාගේ නම):</label>
        <input type="text" id="guestInput" placeholder="Ex: Nimal Perera">
    </div>

    <!-- 4. Event Selection -->
    <div class="form-group">
        <label for="eventType">4. Event Selection (ආරාධනා කරන්නේ කුමන උත්සවයටද?):</label>
        <select id="eventType">
            <option value="wedding">Wedding Day Only</option>
            <option value="homecoming">Homecoming Only</option>
            <option value="both">Both Events (Wedding & Homecoming)</option>
        </select>
    </div>

    <!-- 5. Guest's WhatsApp Number -->
    <div class="form-group">
        <label for="phoneInput">5. Guest's WhatsApp Number (අමුත්තාගේ WhatsApp අංකය):</label>
        <input type="tel" id="phoneInput" placeholder="Ex: 94771234567">
    </div>

    <button id="generateBtn" class="btn generate-btn">✨ Generate Message & Link</button>

    <!-- Output Section -->
    <div class="output-box" id="outputSection" style="display: none;">
        <h4>WhatsApp Message Preview:</h4>
        <textarea id="messageOutput" readonly></textarea>
        <button id="copyBtn" class="btn copy-btn">📋 Copy Message</button>
        <button id="waSendBtn" class="btn" style="background: #128C7E;">💬 Send via WhatsApp</button>
    </div>
</div>
    
<!-- GUEST INVITATION TRACKING DASHBOARD -->
        <hr style="margin: 30px 0; border: 1px solid #ddd;">
        
        <h3 style="text-align: center; color: #d4af37; margin-bottom: 15px; text-transform: uppercase;">📊 Guest Invitation Tracking Dashboard</h3>
        
        <div style="overflow-x: auto; margin-top: 15px;">
            <table id="trackingTable" style="width: 100%; border-collapse: collapse; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-radius: 8px; overflow: hidden; font-size: 13px;">
                <thead>
                    <tr style="background-color: #d4af37; color: white; text-align: left;">
                        <th style="padding: 10px;">Guest Name</th>
                        <th style="padding: 10px;">Side</th>
                        <th style="padding: 10px;">Event</th>
                        <th style="padding: 10px;">Phone Number</th>
                        <th style="padding: 10px;">Status</th>
                        <th style="padding: 10px;">Action</th>
                    </tr>
                </thead>
                <tbody id="trackingTableBody">
                    <!-- Dynamic Data Will Appear Here -->
                </tbody>
            </table>
        </div>
<script src="admin.js"></script>
</body>
</html>
