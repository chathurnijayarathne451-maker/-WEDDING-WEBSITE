<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation Admin Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f2f5; padding: 20px; color: #333; }
        .admin-container { max-width: 600px; margin: 20px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #d4af37; text-align: center; margin-bottom: 20px; font-size: 24px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #d4af37; }
        .btn { width: 100%; padding: 12px; background: #25D366; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .btn:hover { background: #1eb857; }
        .output-box { margin-top: 20px; padding: 15px; background: #e9f7ef; border-radius: 8px; border: 1px solid #c3e6cb; }
        .output-box h4 { margin-bottom: 10px; color: #155724; }
        textarea { width: 100%; height: 180px; padding: 10px; border-radius: 6px; border: 1px solid #a1d9b4; font-size: 13px; resize: none; }
        .copy-btn { margin-top: 10px; background: #3498db; }
        .copy-btn:hover { background: #2980b9; }
    </style>
</head>
<body>

<div class="admin-container">
    <h2>Invitation Link Generator</h2>

    <div class="form-group">
        <label for="senderType">Sender (කවුරුන්ද යවන්නේ?):</label>
        <select id="senderType">
            <option value="bride">Bride (Chathurni Sanchala)</option>
            <option value="groom">Groom (Ashen Anuradha)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="guestInput">Guest Name (අමුත්තාගේ නම):</label>
        <input type="text" id="guestInput" placeholder="Ex: Nimal Perera">
    </div>

    <button id="generateBtn" class="btn">Generate Message & Link</button>

    <div class="output-box" id="outputSection" style="display: none;">
        <h4>WhatsApp Message Preview:</h4>
        <textarea id="messageOutput" readonly></textarea>
        <button id="copyBtn" class="btn copy-btn">📋 Copy Message</button>
        <button id="waSendBtn" class="btn" style="background: #128C7E;">💬 Send via WhatsApp</button>
    </div>
</div>

<script src="admin.js"></script>
</body>
</html>
